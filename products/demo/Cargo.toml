[package]
name = "keel-demo"
description = "The demo product bundle: the note module that dogfoods the platform and is compiled in behind the demo feature of keel-bin"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lib]

[features]
host = ["dep:keel-host"]

[dependencies]
keel = { workspace = true }
keel-host = { workspace = true, optional = true }
keel-system = { workspace = true, features = ["notify"] }

[dev-dependencies]
keel-system = { workspace = true, features = ["auth", "settings", "audit", "tasks", "cron", "notify"] }
keel-testkit = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
