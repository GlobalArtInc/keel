[package]
name = "keel-bin"
description = "The keel binary: the runtime composed with every product bundle of the workspace"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[features]
demo = ["dep:keel-demo"]

[dependencies]
keel = { workspace = true }
keel-demo = { workspace = true, optional = true }

[dev-dependencies]
keel-testkit = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
