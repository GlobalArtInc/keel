[package]
name = "keel-system"
description = "The system modules of the platform, one cargo feature per module, written on the public SDK alone"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = [
  "auth",
  "settings",
  "audit",
  "tasks",
  "cron",
  "notify",
  "webhooks",
  "license",
  "update",
  "backup",
]
audit = ["dep:tokio", "dep:tracing"]
backup = ["tasks", "dep:tokio", "dep:tracing"]
cron = ["dep:croner", "dep:tokio", "dep:tracing"]
license = ["dep:tracing"]
notify = ["cron", "dep:lettre", "dep:minijinja", "dep:tokio", "dep:tracing"]
tasks = ["dep:tokio", "dep:tracing"]
update = [
  "cron",
  "tasks",
  "dep:base64",
  "dep:futures",
  "dep:reqwest",
  "dep:semver",
  "dep:tokio",
  "dep:tracing",
]
webhooks = [
  "notify",
  "dep:hmac",
  "dep:rand",
  "dep:reqwest",
  "dep:sha2",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing",
]
settings = ["dep:jsonschema", "dep:roxmltree"]
auth = [
  "dep:argon2",
  "dep:base32",
  "dep:hmac",
  "dep:ipnet",
  "dep:rand",
  "dep:sha1",
  "dep:sha2",
  "dep:subtle",
  "dep:tokio",
]

[dependencies]
argon2 = { workspace = true, optional = true }
base32 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
croner = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
keel-sdk = { workspace = true }
lettre = { workspace = true, optional = true }
minijinja = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
keel-testkit = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
testcontainers = { workspace = true }
zstd = { workspace = true }
