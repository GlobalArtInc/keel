[package]
name = "keel-system"
description = "The system modules of the platform, one cargo feature per module, written on the public SDK alone"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[features]
default = ["auth", "settings", "audit"]
audit = ["dep:tokio", "dep:tracing"]
settings = ["dep:jsonschema"]
auth = [
  "dep:argon2",
  "dep:base32",
  "dep:hmac",
  "dep:ipnet",
  "dep:rand",
  "dep:sha1",
  "dep:sha2",
  "dep:subtle",
  "dep:tokio",
]

[dependencies]
argon2 = { workspace = true, optional = true }
base32 = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
ipnet = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
keel-sdk = { workspace = true }
rand = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true }
insta = { workspace = true }
keel-testkit = { workspace = true }

[[test]]
name = "audit"
required-features = ["auth", "audit"]

[[test]]
name = "audit_alone"
required-features = ["audit"]

[[test]]
name = "auth_grants"
required-features = ["auth"]

[[test]]
name = "auth_guards"
required-features = ["auth"]

[[test]]
name = "auth_keys"
required-features = ["auth"]

[[test]]
name = "auth_passwords"
required-features = ["auth"]

[[test]]
name = "auth_policy"
required-features = ["auth"]

[[test]]
name = "auth_session_list"
required-features = ["auth"]

[[test]]
name = "auth_sessions"
required-features = ["auth"]

[[test]]
name = "auth_su"
required-features = ["auth"]

[[test]]
name = "auth_tokens"
required-features = ["auth"]

[[test]]
name = "auth_totp"
required-features = ["auth"]

[[test]]
name = "settings"
required-features = ["auth", "settings"]

[[test]]
name = "settings_alone"
required-features = ["settings"]

[[test]]
name = "settings_pref"
required-features = ["auth", "settings"]
