[package]
name = "keel-dev"
description = "The developer CLI: the JSON Schema of the wire contract, the per-level descriptor dump of a started binary, the OpenAPI description written from it and the custom-views share, typed with keel-types alone"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "keel-dev"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
keel-types = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
schemars = { workspace = true }
serde_json = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
