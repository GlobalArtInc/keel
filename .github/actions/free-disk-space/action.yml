name: Free disk space
description: Remove preinstalled toolchains the jobs do not use

runs:
  using: composite
  steps:
    - name: Show the disk before
      shell: bash
      run: df -h /

    - name: Remove unused toolchains
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost

    - name: Show the disk after
      shell: bash
      run: df -h /
