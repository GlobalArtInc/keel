name: Publish @globalart/keel

on:
  push:
    tags:
      - 'keel-v*'
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish; it must be the binary's, the default
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: '@globalart/keel to Astrum'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm through corepack
        working-directory: frontend
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          pnpm --version

      - name: Authenticate to the Astrum npm registry
        uses: ./.github/actions/astrum-npm-auth
        with:
          username: ${{ secrets.ASTRUM_NPM_USERNAME }}
          password: ${{ secrets.ASTRUM_NPM_PASSWORD }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec ng build keel

      - name: Version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${TAG#keel-v}}"
          node tools/stamp.mjs ${version:+"$version"}

      - name: Publish
        working-directory: frontend/dist/keel
        run: pnpm publish --no-git-checks
