name: Release

on:
  push:
    tags:
      - 'keel-v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  KEEL_OWNLATE_TOKEN: ${{ secrets.KEEL_OWNLATE_TOKEN }}
  KEEL_OWNLATE_PROJECT_CORE: ${{ vars.KEEL_OWNLATE_PROJECT_CORE }}
  KEEL_OWNLATE_PROJECT_DEMO: ${{ vars.KEEL_OWNLATE_PROJECT_DEMO }}
  KEEL_OWNLATE_PROJECT_DNS: ${{ vars.KEEL_OWNLATE_PROJECT_DNS }}

jobs:
  release:
    name: keel ${{ github.ref_name }} to the channel
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - name: Fetch the tag with its annotation
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != tag ]; then
            echo "$GITHUB_REF_NAME is not an annotated tag; the release notes are its annotation" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache the build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: musl-release
          save-if: false
          cache-on-failure: true

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm through corepack
        working-directory: frontend
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          pnpm --version

      - name: Authenticate to the Astrum npm registry
        uses: ./.github/actions/astrum-npm-auth
        with:
          username: ${{ secrets.ASTRUM_NPM_USERNAME }}
          password: ${{ secrets.ASTRUM_NPM_PASSWORD }}

      - name: Install the frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build the shell the binary embeds
        working-directory: frontend
        run: pnpm build

      - name: The committed dictionaries match the translation projects
        if: env.KEEL_OWNLATE_TOKEN != ''
        run: |
          cargo run -p keel-dev -- i18n pull --out .
          git diff --exit-code -- crates/kernel/i18n crates/system/i18n products/demo/i18n products/dns/i18n products/dns/crates/dns-zones/i18n products/dns/crates/dns-records/i18n products/dns/crates/dns-templates/i18n

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl -p keel-bin --no-default-features --features dns,panel

      - name: The binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/keel
          if ldd target/x86_64-unknown-linux-musl/release/keel 2>&1 | grep -q '=>'; then
            echo "the binary links shared libraries" >&2
            exit 1
          fi

      - name: The binary carries the version of the tag
        run: |
          printed=$(target/x86_64-unknown-linux-musl/release/keel --version)
          expected="keel ${GITHUB_REF_NAME#keel-v}"
          if [ "$printed" != "$expected" ]; then
            echo "the binary prints \"$printed\" but the tag names \"$expected\"; bump the workspace version first" >&2
            exit 1
          fi

      - name: The binary is within the cap of hack/size-cap
        run: hack/check-size.sh target/x86_64-unknown-linux-musl/release/keel

      - name: Sign, upload and read back the release
        env:
          KEEL_RELEASE_KEY: ${{ secrets.KEEL_RELEASE_KEY }}
          KEEL_RELEASE_NEXUS_PASSWORD: ${{ secrets.KEEL_RELEASE_NEXUS_PASSWORD }}
        run: python3 hack/release.py --tag "$GITHUB_REF_NAME" --binary target/x86_64-unknown-linux-musl/release/keel
