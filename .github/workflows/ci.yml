name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_BUILD_JOBS: 6
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: postgres
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports: ['1025', '8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put cargo on the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Link the runner's build directory
        run: |
          dir="/opt/actions-runner/cache/keel/$RUNNER_NAME/target"
          mkdir -p "$dir"
          rm -rf target
          ln -sfn "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache the cargo download directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Find the IPv4 port of Postgres
        run: |
          port=$(docker port "${{ job.services.postgres.id }}" 5432/tcp | awk '/^0\.0\.0\.0:/ { sub(/.*:/, ""); print; exit }')
          test -n "$port"
          echo "KEEL_TEST_DATABASE_URL=postgres://keel:keel@127.0.0.1:$port/postgres" >> "$GITHUB_ENV"

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -d "$KEEL_TEST_DATABASE_URL" && exit 0
            sleep 2
          done
          echo "postgres did not come up" >&2
          exit 1

      - name: Find the IPv4 ports of the mail catcher
        run: |
          smtp=$(docker port "${{ job.services.mailpit.id }}" 1025/tcp | awk '/^0\.0\.0\.0:/ { sub(/.*:/, ""); print; exit }')
          api=$(docker port "${{ job.services.mailpit.id }}" 8025/tcp | awk '/^0\.0\.0\.0:/ { sub(/.*:/, ""); print; exit }')
          test -n "$smtp" && test -n "$api"
          echo "KEEL_TEST_SMTP_URL=smtp://127.0.0.1:$smtp" >> "$GITHUB_ENV"
          echo "KEEL_TEST_SMTP_API=http://127.0.0.1:$api" >> "$GITHUB_ENV"

      - name: Wait for the mail catcher
        run: |
          for i in $(seq 1 30); do
            curl -sf "$KEEL_TEST_SMTP_API/readyz" >/dev/null && exit 0
            sleep 2
          done
          echo "the mail catcher did not come up" >&2
          exit 1

      - name: Format
        run: cargo fmt --all --check

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the frontend dependencies
        working-directory: frontend
        env:
          NEXUS_NPM_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build the shell the binary embeds
        working-directory: frontend
        run: pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: The testkit against the Postgres it starts itself
        run: env -u KEEL_TEST_DATABASE_URL cargo test -p keel-testkit

      - name: The schema of the wire contract is committed
        run: cargo run -p keel-dev -- types --out contracts/schema --check

      - name: The binary without the demo bundle
        run: cargo test -p keel-bin --no-default-features

      - name: Build the binary with the demo bundle
        run: cargo build -p keel-bin

      - name: Prove the binary
        run: hack/prove-binary.sh target/debug/keel

      - name: The installer against the binary
        run: hack/check-install.sh target/debug/keel

      - name: The release workflow against a directory
        env:
          KEEL_RELEASE_KEY: ${{ secrets.KEEL_RELEASE_KEY }}
        run: hack/check-release.sh target/debug/keel

      - name: Conformance against the binary
        run: hack/conformance.sh target/debug/keel

      - name: The descriptor dump, the OpenAPI document and the custom-views share against the binary
        run: hack/descriptors.sh target/debug/keel

      - name: Every key the registry emits is translated in en and ru
        run: cargo run -p keel-dev -- i18n missing --dump contracts/dump

      - name: Install chromium for the browser suite
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: The browser suite against the binary
        run: hack/e2e.sh target/debug/keel

      - name: Keep the traces of a failed browser suite
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/e2e/test-results
          if-no-files-found: ignore

      - name: No test database remains
        run: hack/check-test-databases.sh

      - name: Dependency boundaries
        run: hack/check-deps.sh

      - name: Documents against the code
        run: hack/check-docs.sh

      - name: Find the baseline of the facade
        id: baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rev=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].head_sha // empty' || true)
          rev="${rev:-${{ github.event.before || 'HEAD~1' }}}"
          if git cat-file -e "$rev:crates/keel/Cargo.toml" 2>/dev/null; then
            echo "rev=$rev" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Public API of the facade
        if: steps.baseline.outputs.present == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: keel
          baseline-rev: ${{ steps.baseline.outputs.rev }}

  system:
    name: keel-system with ${{ matrix.features }}
    needs: check
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        features:
          - auth
          - settings
          - audit
          - tasks
          - cron
          - notify
          - webhooks
          - update
          - backup
          - tasks,cron,notify,update
          - tasks,backup
          - settings,audit,tasks,cron,notify,webhooks
          - auth,audit,tasks,cron,notify,webhooks
          - auth,settings,tasks,cron,notify,webhooks
          - auth,settings,audit,cron,notify,webhooks
          - auth,settings,audit,tasks
          - auth,settings,audit,tasks,cron
          - auth,settings,audit,tasks,cron,notify

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: postgres
        ports: ['5432']
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports: ['1025', '8025']
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put cargo on the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Link the runner's build directory
        run: |
          dir="/opt/actions-runner/cache/keel/$RUNNER_NAME/target"
          mkdir -p "$dir"
          rm -rf target
          ln -sfn "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache the cargo download directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Find the IPv4 port of Postgres
        run: |
          port=$(docker port "${{ job.services.postgres.id }}" 5432/tcp | awk '/^0\.0\.0\.0:/ { sub(/.*:/, ""); print; exit }')
          test -n "$port"
          echo "KEEL_TEST_DATABASE_URL=postgres://keel:keel@127.0.0.1:$port/postgres" >> "$GITHUB_ENV"

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -d "$KEEL_TEST_DATABASE_URL" && exit 0
            sleep 2
          done
          echo "postgres did not come up" >&2
          exit 1

      - name: Find the IPv4 ports of the mail catcher
        run: |
          smtp=$(docker port "${{ job.services.mailpit.id }}" 1025/tcp | awk '/^0\.0\.0\.0:/ { sub(/.*:/, ""); print; exit }')
          api=$(docker port "${{ job.services.mailpit.id }}" 8025/tcp | awk '/^0\.0\.0\.0:/ { sub(/.*:/, ""); print; exit }')
          test -n "$smtp" && test -n "$api"
          echo "KEEL_TEST_SMTP_URL=smtp://127.0.0.1:$smtp" >> "$GITHUB_ENV"
          echo "KEEL_TEST_SMTP_API=http://127.0.0.1:$api" >> "$GITHUB_ENV"

      - name: Wait for the mail catcher
        run: |
          for i in $(seq 1 30); do
            curl -sf "$KEEL_TEST_SMTP_API/readyz" >/dev/null && exit 0
            sleep 2
          done
          echo "the mail catcher did not come up" >&2
          exit 1

      - name: Clippy
        run: cargo clippy -p keel-system --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings

      - name: Test
        run: cargo test -p keel-system --no-default-features --features ${{ matrix.features }}

      - name: No test database remains
        run: hack/check-test-databases.sh

  frontend:
    name: frontend lint, format, test, build, storybook
    needs: check
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put cargo on the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Link the runner's build directory
        run: |
          dir="/opt/actions-runner/cache/keel/$RUNNER_NAME/target"
          mkdir -p "$dir"
          rm -rf target
          ln -sfn "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        env:
          NEXUS_NPM_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Generate the wire types, the icon set and the boot fixtures
        run: pnpm generate

      - name: The generated wire types, the icon set and the boot fixtures are committed
        run: git diff --exit-code

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Install chromium for the Storybook test runner
        run: pnpm exec playwright install chromium

      - name: Stories and accessibility against the static Storybook
        run: |
          pnpm exec http-server storybook-static --port 6006 --silent &
          pnpm exec wait-on http://127.0.0.1:6006/index.json
          pnpm test-storybook

      - name: Keep the static Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: frontend/storybook-static
          if-no-files-found: error

      - name: Stamp the version of @globalart/keel
        run: node tools/stamp.mjs

      - name: Dry run of the publication of @globalart/keel
        working-directory: frontend/dist/keel
        env:
          NEXUS_NPM_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
        run: pnpm publish --dry-run --no-git-checks
