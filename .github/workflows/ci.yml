name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      - name: Cache the cargo download directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U keel && exit 0
            sleep 2
          done
          echo "postgres did not come up" >&2
          exit 1

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        env:
          KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres
        run: cargo test --workspace

      - name: The testkit against the Postgres it starts itself
        run: env -u KEEL_TEST_DATABASE_URL cargo test -p keel-testkit

      - name: The binary without the demo bundle
        run: cargo test -p keel-bin --no-default-features

      - name: Build the binary with the demo bundle
        run: cargo build -p keel-bin

      - name: Prove the binary
        env:
          KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres
        run: hack/prove-binary.sh target/debug/keel

      - name: Conformance against the binary
        env:
          KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres
        run: hack/conformance.sh target/debug/keel

      - name: No test database remains
        env:
          KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres
        run: hack/check-test-databases.sh

      - name: Dependency boundaries
        run: hack/check-deps.sh

      - name: Find the baseline of the facade
        id: baseline
        run: |
          rev="${{ github.event.before || 'HEAD~1' }}"
          if git cat-file -e "$rev:crates/keel/Cargo.toml" 2>/dev/null; then
            echo "rev=$rev" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Public API of the facade
        if: steps.baseline.outputs.present == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: keel
          baseline-rev: ${{ steps.baseline.outputs.rev }}

  system:
    name: keel-system with ${{ matrix.features }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        features:
          - auth
          - settings
          - audit
          - settings,audit
          - auth,audit
          - auth,settings

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keel
          POSTGRES_PASSWORD: keel
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U keel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache the cargo download directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 -U keel && exit 0
            sleep 2
          done
          echo "postgres did not come up" >&2
          exit 1

      - name: Clippy
        run: cargo clippy -p keel-system --all-targets --no-default-features --features ${{ matrix.features }} -- -D warnings

      - name: Test
        env:
          KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres
        run: cargo test -p keel-system --no-default-features --features ${{ matrix.features }}

      - name: No test database remains
        env:
          KEEL_TEST_DATABASE_URL: postgres://keel:keel@127.0.0.1:5432/postgres
        run: hack/check-test-databases.sh
