name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_BUILD_JOBS: 6
  KEEL_OWNLATE_TOKEN: ${{ secrets.KEEL_OWNLATE_TOKEN }}
  KEEL_OWNLATE_PROJECT_CORE: ${{ vars.KEEL_OWNLATE_PROJECT_CORE }}
  KEEL_OWNLATE_PROJECT_DEMO: ${{ vars.KEEL_OWNLATE_PROJECT_DEMO }}
  KEEL_OWNLATE_PROJECT_DNS: ${{ vars.KEEL_OWNLATE_PROJECT_DNS }}
  KEEL_OWNLATE_PROJECT_PANEL: ${{ vars.KEEL_OWNLATE_PROJECT_PANEL }}

jobs:
  linux-musl:
    name: keel for x86_64-unknown-linux-musl
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Put cargo on the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Link the runner's build directory
        run: |
          dir="/opt/actions-runner/cache/keel/$RUNNER_NAME/target"
          mkdir -p "$dir"
          rm -rf target
          ln -sfn "$dir" target
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl

      - name: Cache the cargo download directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-musl-

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install the frontend dependencies
        working-directory: frontend
        env:
          NEXUS_NPM_TOKEN: ${{ secrets.NEXUS_NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Build the shell the binary embeds
        working-directory: frontend
        run: pnpm build

      - name: The committed dictionaries match the translation projects
        if: env.KEEL_OWNLATE_TOKEN != ''
        run: |
          cargo run -p keel-dev -- i18n pull --out .
          git diff --exit-code -- crates/kernel/i18n crates/host/i18n crates/system/i18n products/demo/i18n products/dns/i18n products/dns/crates/dns-zones/i18n products/dns/crates/dns-records/i18n products/dns/crates/dns-templates/i18n products/panel/i18n products/panel/crates/hosting-users/i18n

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl -p keel-bin

      - name: The binary is static
        run: |
          file target/x86_64-unknown-linux-musl/release/keel
          if ldd target/x86_64-unknown-linux-musl/release/keel 2>&1 | grep -q '=>'; then
            echo "the binary links shared libraries" >&2
            exit 1
          fi
          target/x86_64-unknown-linux-musl/release/keel --version

      - name: The size check refuses a binary above its cap
        run: hack/check-size-test.sh

      - name: The binary is within the cap of hack/size-cap
        run: hack/check-size.sh target/x86_64-unknown-linux-musl/release/keel

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/keel dist/keel
          tar -C dist -cf - keel | zstd -19 -o "dist/keel-${GITHUB_SHA::7}-x86_64-linux-musl.tar.zst"
          (cd dist && sha256sum "keel-${GITHUB_SHA::7}-x86_64-linux-musl.tar.zst" > "keel-${GITHUB_SHA::7}-x86_64-linux-musl.tar.zst.sha256")

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: keel-x86_64-linux-musl
          path: |
            dist/*.tar.zst
            dist/*.sha256
          retention-days: 14
          if-no-files-found: error
