[workspace]
resolver = "3"
members = ["crates/*", "products/*", "bin/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
repository = "https://github.com/GlobalArtInc/keel"

[workspace.dependencies]
keel = { path = "crates/keel" }
keel-demo = { path = "products/demo" }
keel-kernel = { path = "crates/kernel" }
keel-sdk = { path = "crates/sdk" }
keel-system = { path = "crates/system" }
keel-testkit = { path = "crates/testkit" }
keel-types = { path = "crates/types" }

aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
async-trait = "0.1"
axum = "0.8"
base32 = "0.5"
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hmac = "0.13"
http = "1"
indexmap = { version = "2", features = ["serde"] }
insta = { version = "1", features = ["json", "redactions"] }
ipnet = "2"
jsonschema = { version = "0.56", default-features = false }
migrator = { package = "sqlmig", version = "0.2.1" }
minijinja = "2"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
roxmltree = "0.21"
rust-embed = { version = "8", features = ["debug-embed"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = { version = "1", features = ["chrono04"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "postgres-array", "with-chrono", "with-json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha1 = "0.11"
sha2 = "0.11"
similar = "2"
subtle = "2"
tempfile = "3"
testcontainers = { version = "0.27", default-features = false, features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "fs", "process"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "3", features = ["serde"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
