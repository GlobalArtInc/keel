[workspace]
resolver = "3"
members = ["crates/*", "products/*", "products/*/crates/*", "bin/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
publish = false
repository = "https://github.com/GlobalArtInc/keel"

[workspace.dependencies]
keel = { path = "crates/keel" }
keel-client = { path = "crates/client" }
keel-demo = { path = "products/demo" }
keel-dns = { path = "products/dns" }
keel-dns-local = { path = "products/panel/crates/dns-local" }
keel-dns-peer = { path = "products/panel/crates/dns-peer" }
keel-dns-records = { path = "products/dns/crates/dns-records" }
keel-dns-templates = { path = "products/dns/crates/dns-templates" }
keel-dns-zones = { path = "products/dns/crates/dns-zones" }
keel-host = { path = "crates/host" }
keel-host-agent = { path = "crates/host-agent" }
keel-hosting-backup = { path = "products/panel/crates/hosting-backup" }
keel-hosting-db = { path = "products/panel/crates/hosting-db" }
keel-hosting-ftp = { path = "products/panel/crates/hosting-ftp" }
keel-hosting-mail = { path = "products/panel/crates/hosting-mail" }
keel-hosting-services = { path = "products/panel/crates/hosting-services" }
keel-hosting-ssl = { path = "products/panel/crates/hosting-ssl" }
keel-hosting-users = { path = "products/panel/crates/hosting-users" }
keel-hosting-web = { path = "products/panel/crates/hosting-web" }
keel-kernel = { path = "crates/kernel" }
keel-panel = { path = "products/panel" }
keel-release = { path = "crates/release" }
keel-sdk = { path = "crates/sdk" }
keel-system = { path = "crates/system", default-features = false }
keel-testkit = { path = "crates/testkit" }
keel-types = { path = "crates/types" }

aes-gcm = "0.11"
anyhow = "1"
argon2 = "0.6"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.22"
base32 = "0.5"
blake3 = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
croner = "4"
ed25519-dalek = "3"
futures = "0.3"
hmac = "0.13"
hostname = "0.4"
http = "1"
indexmap = { version = "2", features = ["serde"] }
insta = { version = "1", features = ["json", "redactions"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "rcgen", "ring"] }
ipnet = "2"
jsonschema = { version = "0.56", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
migrator = { package = "sqlmig", version = "0.2.1" }
minijinja = { version = "2", features = ["custom_syntax"] }
nix = { version = "0.29", features = ["fs", "sched", "socket", "term", "user"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rand = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
roxmltree = "0.21"
rust-embed = { version = "8", features = ["debug-embed"] }
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
schemars = { version = "1", features = ["chrono04"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "postgres-array", "with-chrono", "with-json"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha-crypt = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
sha1 = "0.11"
sha2 = "0.11"
similar = "2"
subtle = "2"
tar = "0.4"
tempfile = "3"
testcontainers = { version = "0.27", default-features = false, features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "fs", "process"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "3", features = ["serde"] }
x509-parser = { version = "0.18", default-features = false }
zstd = "0.14"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
