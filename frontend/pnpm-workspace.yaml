packages:
  - libs/*
  - apps/*
  - products/*

engineStrict: true

minimumReleaseAgeExclude:
  - '@globalart/*'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': false
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: false

fetchRetries: 5
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 60000
fetchTimeout: 120000
