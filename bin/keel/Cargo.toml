[package]
name = "keel-bin"
description = "The keel binary: the runtime composed with every product bundle of the workspace"
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "keel"
path = "src/main.rs"

[features]
default = ["demo"]
demo = ["dep:keel-demo"]

[dependencies]
keel = { workspace = true }
keel-demo = { workspace = true, optional = true }
keel-system = { workspace = true, features = ["auth", "settings", "audit", "tasks", "cron", "notify", "webhooks", "update", "backup"] }

[dev-dependencies]
keel-testkit = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
